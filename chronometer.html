<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronometer</title>
	<link rel="icon" sizes="64x64" href="1302539.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0a0f1d',
                            panel: '#111827',
                            primary: '#06b6d4',
                            accent: '#a855f7',
                            neonGreen: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .neon-border {
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.1);
        }
        .dark .neon-border:hover {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }
        .font-mono {
            font-family: 'Roboto', sans-serif;
			/*font-family: 'Courier New', Courier, monospace*/
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-[#0a0f1d] dark:text-slate-100 min-h-screen transition-colors duration-300 font-sans">

    <header class="border-b border-slate-300 dark:border-cyan-900/50 bg-white dark:bg-[#111827] sticky top-0 z-50 transition-colors duration-300 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">

            
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-cyan-500/10 rounded-lg text-cyan-500 border border-cyan-500/30 animate-pulse">
					<img src="logo_colegio.png" alt="Modelo LLM" width="50" heigth="50" style="display: block; margin: 0 auto;">
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black tracking-wider uppercase bg-gradient-to-r from-cyan-500 to-purple-500 bg-clip-text text-transparent">
                        CHRONOS REGIONALES
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-cyan-400/70 font-mono">PANEL DE CONTROL & PENALIZACIONES</p>
                </div>
            </div>

            <div class="flex items-center flex-wrap gap-3 bg-slate-200/50 dark:bg-slate-800/40 p-2 rounded-xl border border-slate-300 dark:border-slate-700">
                <label for="teamCount" class="text-xs md:text-sm font-semibold font-mono">Nº EQUIPOS:</label>
                <input type="number" id="teamCount" value="4" min="1" max="50" 
                    class="w-16 bg-white dark:bg-slate-900 border border-slate-400 dark:border-cyan-800 rounded px-2 py-1 text-center font-bold focus:outline-none focus:border-cyan-500 text-slate-900 dark:text-white">
                <button onclick="setupTimers()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-mono text-xs font-bold px-3 py-1.5 rounded uppercase transition shadow-sm">
                    Generar
                </button>
            </div>

            <div class="flex items-center flex-wrap gap-2">
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-yellow-500 dark:text-cyan-400 transition mr-2" title="Cambiar Tema">
                    <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
                </button>

                <button onclick="startAll()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-mono font-bold px-3 py-2 rounded-lg uppercase transition-all flex items-center space-x-1.5 shadow-md text-xs md:text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <span>INICIAR TODO</span>
                </button>

                <button onclick="pauseAll()" class="bg-blue-600 hover:bg-blue-500 text-white font-mono font-bold px-3 py-2 rounded-lg uppercase transition-all flex items-center space-x-1.5 shadow-md text-xs md:text-sm border border-blue-400/30 animate-pulse">
                    <div class="w-3 h-4 bg-blue-300 rounded-sm"></div>
                    <span>PAUSA GENERAL</span>
                </button>

                <button onclick="resetAll()" class="bg-rose-600 hover:bg-rose-500 text-white font-mono font-bold px-3 py-2 rounded-lg uppercase transition-all flex items-center space-x-1.5 shadow-md text-xs md:text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    <span>REINICIAR TODO</span>
                </button>
            </div>

        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="timersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <script>
        // --- LOGICA DE TEMA ---
        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('themeIcon');
            if (isDark) {
                icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M2 12h2"/><path d="M20 12h2"/>';
            } else {
                icon.innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
            }
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            updateThemeIcon();
        }

        if (localStorage.theme === 'light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
        updateThemeIcon();

        // --- SISTEMA MULTICRONÓMETRO ---
        let timersData = [];
        let globalInterval = null;

        function setupTimers() {
            clearInterval(globalInterval);
            globalInterval = null;

            const count = parseInt(document.getElementById('teamCount').value) || 1;
            const container = document.getElementById('timersContainer');
            container.innerHTML = '';
            timersData = [];

            for (let i = 1; i <= count; i++) {
                const teamId = i;
                timersData.push({
                    id: teamId,
                    name: `TEAM_0${teamId}`,
                    elapsedTime: 0,
                    isRunning: false,
                    lastUpdated: null,
                    logoUrl: null,
                    penalties: { yellow: 0, red: 0, purple: 0 }
                });

                const card = document.createElement('div');
                card.id = `card-${teamId}`;
                card.className = "bg-white dark:bg-[#111827] rounded-xl border border-slate-300 dark:border-cyan-950 neon-border p-5 transition-all duration-300 flex flex-col justify-between relative overflow-hidden";
                
                card.innerHTML = `
                    <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-cyan-500 via-transparent to-purple-500"></div>
                    
                    <div>
                        <div class="flex items-center space-x-3 mb-3">
                            <div class="relative w-14 h-14 bg-slate-200 dark:bg-slate-800 rounded-lg border-2 border-dashed border-slate-400 dark:border-cyan-800 flex items-center justify-center overflow-hidden cursor-pointer">
                                <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10" onchange="handleLogoUpload(event, ${teamId})">
                                <img id="logo-preview-${teamId}" class="w-full h-full object-cover hidden" />
                                <div id="logo-placeholder-${teamId}" class="text-slate-400 text-center flex flex-col items-center">
                                    <span class="text-[8px] font-mono font-bold">ADD LOGO</span>
                                </div>
                            </div>
                            
                            <div class="flex-1">
                                <input type="text" value="TEAM_0${teamId}" onchange="updateTeamName(${teamId}, this.value)" 
                                    class="bg-transparent border-b border-transparent hover:border-slate-400 dark:hover:border-cyan-800 focus:border-cyan-500 focus:outline-none text-base font-bold font-mono tracking-wide w-full text-slate-800 dark:text-cyan-400 uppercase">
                                <div class="flex items-center space-x-1.5 mt-0.5">
                                    <span id="status-indicator-${teamId}" class="w-2 h-2 rounded-full bg-slate-400 dark:bg-slate-600"></span>
                                    <span id="status-text-${teamId}" class="text-[10px] font-mono uppercase text-slate-400">EN ESPERA</span>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-900 text-slate-100 dark:bg-black/40 rounded-lg p-3 my-2 border border-slate-300 dark:border-slate-800 text-center font-mono relative">
                            <div id="display-${teamId}" class="text-2xl md:text-3xl font-black tracking-widest text-slate-700 dark:text-emerald-400">
                                00:00:00.<span class="text-lg text-slate-500">000</span>
                            </div>
                        </div>

                        <div class="bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 rounded-lg p-2.5 my-3">
                            <p class="text-[10px] font-mono text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2 text-center font-bold">Módulo de Penalizaciones</p>
                            <div class="grid grid-cols-3 gap-2 text-center">
                                
                                <button onclick="applyPenalty(${teamId}, 'yellow')" class="group bg-slate-200 dark:bg-slate-800 hover:bg-amber-500/20 p-1.5 rounded border border-slate-300 dark:border-slate-700 transition flex flex-col items-center">
                                    <div class="w-4 h-6 bg-yellow-400 rounded shadow-sm group-hover:scale-105 transition"></div>
                                    <span class="text-[10px] font-bold font-mono mt-1 text-yellow-600 dark:text-yellow-400">+1 Min</span>
                                    <span id="badge-yellow-${teamId}" class="text-[9px] bg-slate-300 dark:bg-slate-700 px-1.5 rounded-full mt-0.5 font-bold">0</span>
                                </button>

                                <button onclick="applyPenalty(${teamId}, 'red')" class="group bg-slate-200 dark:bg-slate-800 hover:bg-rose-500/20 p-1.5 rounded border border-slate-300 dark:border-slate-700 transition flex flex-col items-center">
                                    <div class="w-4 h-6 bg-rose-500 rounded shadow-sm group-hover:scale-105 transition"></div>
                                    <span class="text-[10px] font-bold font-mono mt-1 text-rose-500">+20s</span>
                                    <span id="badge-red-${teamId}" class="text-[9px] bg-slate-300 dark:bg-slate-700 px-1.5 rounded-full mt-0.5 font-bold">0</span>
                                </button>

                                <button onclick="applyPenalty(${teamId}, 'purple')" class="group bg-slate-200 dark:bg-slate-800 hover:bg-purple-500/20 p-1.5 rounded border border-slate-300 dark:border-slate-700 transition flex flex-col items-center">
                                    <div class="w-4 h-6 bg-purple-500 rounded shadow-sm group-hover:scale-105 transition"></div>
                                    <span class="text-[9px] font-bold font-mono mt-1 text-purple-500 uppercase tracking-tighter">Fallo</span>
                                    <span id="badge-purple-${teamId}" class="text-[9px] bg-slate-300 dark:bg-slate-700 px-1.5 rounded-full mt-0.5 font-bold">0</span>
                                </button>

                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mt-1 font-mono text-xs">
                        <button id="btn-toggle-${teamId}" onclick="toggleTimer(${teamId})" 
                            class="bg-slate-700 hover:bg-slate-600 dark:bg-cyan-950 dark:hover:bg-cyan-900 text-white border border-slate-600 dark:border-cyan-800/60 p-2 rounded font-bold uppercase transition flex items-center justify-center space-x-1">
                            <span id="btn-text-${teamId}">Iniciar</span>
                        </button>
                        <button onclick="resetTimer(${teamId})" 
                            class="bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-700 p-2 rounded font-bold uppercase transition flex items-center justify-center">
                            Reset
                        </button>
                    </div>
                `;
                container.appendChild(card);
            }
            timersData.forEach(t => updateDisplay(t.id));
        }

        // --- SISTEMA DE PENALIZACIONES ---
        function applyPenalty(id, type) {
            const timer = timersData.find(t => t.id === id);
            if (!timer) return;

            // Incrementar contador de tarjetas
            timer.penalties[type]++;
            document.getElementById(`badge-${type}-${id}`).innerText = timer.penalties[type];

            // Aplicar efectos de tiempo según corresponda
            if (type === 'yellow') {
                timer.elapsedTime += 60000; // 1 minuto en ms
            } else if (type === 'red') {
                timer.elapsedTime += 20000; // 20 segundos en ms
            } else if (type === 'purple') {
                // Notificación o flash visual de fallo (no altera tiempo)
                const card = document.getElementById(`card-${id}`);
                card.classList.add('border-purple-500', 'bg-purple-500/5');
                setTimeout(() => {
                    card.classList.remove('border-purple-500', 'bg-purple-500/5');
                }, 800);
            }

            updateDisplay(id);
        }

        // --- MANEJO DEL TIEMPO ---
        function formatTime(ms) {
            let milliseconds = parseInt(ms % 1000);
            let seconds = parseInt((ms / 1000) % 60);
            let minutes = parseInt((ms / (1000 * 60)) % 60);
            let hours = parseInt((ms / (1000 * 60 * 60)) % 24);

            hours = (hours < 10) ? "0" + hours : hours;
            minutes = (minutes < 10) ? "0" + minutes : minutes;
            seconds = (seconds < 10) ? "0" + seconds : seconds;
            
            if (milliseconds < 10) milliseconds = "00" + milliseconds;
            else if (milliseconds < 100) milliseconds = "0" + milliseconds;

            return `${hours}:${minutes}:${seconds}.<span class="text-lg opacity-80">${milliseconds}</span>`;
        }

        function updateDisplay(id) {
            const timer = timersData.find(t => t.id === id);
            const displayEl = document.getElementById(`display-${id}`);
            if (displayEl) displayEl.innerHTML = formatTime(timer.elapsedTime);
        }

        function updateTeamName(id, newName) {
            const timer = timersData.find(t => t.id === id);
            if (timer) timer.name = newName.toUpperCase();
        }

        function handleLogoUpload(event, id) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const timer = timersData.find(t => t.id === id);
                    if (timer) timer.logoUrl = e.target.result;
                    document.getElementById(`logo-preview-${id}`).src = e.target.result;
                    document.getElementById(`logo-preview-${id}`).classList.remove('hidden');
                    document.getElementById(`logo-placeholder-${id}`).classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function startGlobalEngine() {
            if (!globalInterval) {
                globalInterval = setInterval(() => {
                    const now = performance.now();
                    timersData.forEach(timer => {
                        if (timer.isRunning) {
                            if (timer.lastUpdated) {
                                timer.elapsedTime += (now - timer.lastUpdated);
                            }
                            timer.lastUpdated = now;
                            updateDisplay(timer.id);
                        }
                    });
                }, 16);
            }
        }

        function toggleTimer(id) {
            const timer = timersData.find(t => t.id === id);
            if (!timer) return;

            if (timer.isRunning) {
                timer.isRunning = false;
                timer.lastUpdated = null;
                updateUIPaused(id);
            } else {
                timer.isRunning = true;
                timer.lastUpdated = performance.now();
                updateUIRunning(id);
                startGlobalEngine();
            }
        }

        function resetTimer(id) {
            const timer = timersData.find(t => t.id === id);
            if (!timer) return;
            
            timer.isRunning = false;
            timer.elapsedTime = 0;
            timer.lastUpdated = null;
            timer.penalties = { yellow: 0, red: 0, purple: 0 };
            
            // Resetear contadores de badges
            document.getElementById(`badge-yellow-${id}`).innerText = "0";
            document.getElementById(`badge-red-${id}`).innerText = "0";
            document.getElementById(`badge-purple-${id}`).innerText = "0";

            updateDisplay(id);
            updateUIStandby(id);
        }

        // --- CONTROLES GLOBALES DE BARRA SUPERIOR ---
        function startAll() {
            const now = performance.now();
            timersData.forEach(timer => {
                if (!timer.isRunning) {
                    timer.isRunning = true;
                    timer.lastUpdated = now;
                    updateUIRunning(timer.id);
                }
            });
            startGlobalEngine();
        }

        // TARJETA AZUL: Pausa de manera contundente a todos los competidores en carrera
        function pauseAll() {
            timersData.forEach(timer => {
                if (timer.isRunning) {
                    timer.isRunning = false;
                    timer.lastUpdated = null;
                    updateUIPaused(timer.id);
                }
            });
        }

        function resetAll() {
            clearInterval(globalInterval);
            globalInterval = null;
            timersData.forEach(timer => {
                resetTimer(timer.id);
            });
        }

        // --- MANIPULACIÓN VISUAL (UI) ---
        function updateUIRunning(id) {
            document.getElementById(`status-indicator-${id}`).className = "w-2 h-2 rounded-full bg-emerald-500 animate-ping";
            document.getElementById(`status-text-${id}`).innerText = "COMPITIENDO";
            document.getElementById(`status-text-${id}`).className = "text-[10px] font-mono uppercase text-emerald-500 font-bold";
            document.getElementById(`display-${id}`).className = "text-2xl md:text-3xl font-black tracking-widest text-emerald-600 dark:text-emerald-400 filter drop-shadow-[0_0_8px_rgba(16,185,129,0.3)]";
            document.getElementById(`btn-text-${id}`).innerText = "Pausar";
        }

        function updateUIPaused(id) {
            document.getElementById(`status-indicator-${id}`).className = "w-2 h-2 rounded-full bg-amber-500 animate-none";
            document.getElementById(`status-text-${id}`).innerText = "PAUSADO";
            document.getElementById(`status-text-${id}`).className = "text-[10px] font-mono uppercase text-amber-500 font-bold";
            document.getElementById(`display-${id}`).className = "text-2xl md:text-3xl font-black tracking-widest text-amber-600 dark:text-amber-400";
            document.getElementById(`btn-text-${id}`).innerText = "Reanudar";
        }

        function updateUIStandby(id) {
            document.getElementById(`status-indicator-${id}`).className = "w-2 h-2 rounded-full bg-slate-400 dark:bg-slate-600 animate-none";
            document.getElementById(`status-text-${id}`).innerText = "EN ESPERA";
            document.getElementById(`status-text-${id}`).className = "text-[10px] font-mono uppercase text-slate-400 dark:text-slate-500";
            document.getElementById(`display-${id}`).className = "text-2xl md:text-3xl font-black tracking-widest text-slate-400 dark:text-slate-600";
            document.getElementById(`btn-text-${id}`).innerText = "Iniciar";
        }

        // Inicializar
        setupTimers();
    </script>
</body>
</html>
